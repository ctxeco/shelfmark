name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Sanitize + hygiene + secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Sanitization gate
        run: ./scripts/sanitize-check.sh
      - name: Hygiene gate
        run: ./scripts/hygiene-check.sh
      - name: Consent pin gate
        run: ./scripts/consent-pin-check.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: DCO
        if: github.event_name == 'pull_request'
        run: |
          set -e
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          while IFS= read -r c; do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Missing Signed-off-by: $c $(git log -1 --format=%s "$c")"; bad=1
            fi
          done < <(git rev-list "$base".."$head")
          exit "$bad"

  build-test:
    name: Build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  semgrep:
    # Ported from the internal reusable SAST template; renamed, SARIF added
    # (public repos get the security tab free — the private template's stated
    # reason for omitting SARIF no longer applies).
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest-nonroot
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Semgrep scan
        run: semgrep scan --config auto --error --quiet --sarif --output semgrep.sarif .
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: semgrep.sarif
