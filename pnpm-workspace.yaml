packages:
  - "packages/*"
  - "demo"

# Supply-chain settings (pnpm >= 10.26). A version must be a week old before
# it resolves (dependabot's cooldown matches), transitive dependencies may not
# come from git/tarball URLs, and a package whose publish provenance weakens
# between versions is refused.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
# trustPolicy judges trust by publish DATE, not semver: a release published
# without the provenance an earlier release carried is refused as a possible
# takeover. These three locked versions trip exactly that — each published by
# the package's own maintainers — and were audited before being exempted
# (2026-09-10): lockfile integrity matches the registry, no install-time
# scripts, and the code diff against the previous release on the same line is
# benign.
#   chokidar@4.0.3       type-definition changes only (via tsup, dev)
#   pdf-parse@1.1.4      drops a debug-mode file read and `debugger`
#                        statements; bundled pdf.js byte-identical (demo)
#   semver@6.3.1         the ReDoS-hardening release (via Babel, dev)
# Entries are exact versions, so every other version of these packages is
# still checked. Delete an entry once the lockfile no longer resolves it.
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "pdf-parse@1.1.4"
  - "semver@6.3.1"
