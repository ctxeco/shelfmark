name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Sanitize + hygiene + secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Sanitization gate
        run: ./scripts/sanitize-check.sh
      - name: Hygiene gate
        run: ./scripts/hygiene-check.sh
      - name: Consent pin gate
        run: ./scripts/consent-pin-check.sh
      - name: Gitleaks
        # The gitleaks CLI (MIT) rather than gitleaks-action: the action
        # refuses to run on an organization-owned repo without a
        # GITLEAKS_LICENSE secret, and failed every run here on exactly that.
        # Same scanner, over the whole history (fetch-depth: 0 above), with
        # the release tarball verified against its published SHA-256.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
      - name: DCO
        if: github.event_name == 'pull_request'
        run: |
          set -e
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          while IFS= read -r c; do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Missing Signed-off-by: $c $(git log -1 --format=%s "$c")"; bad=1
            fi
          done < <(git rev-list "$base".."$head")
          exit "$bad"

  build-test:
    name: Build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  semgrep:
    # Ported from the internal reusable SAST template; renamed, SARIF added
    # (public repos get the security tab free — the private template's stated
    # reason for omitting SARIF no longer applies).
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      security-events: write
    # Not a job-level `container:`. This job used to run inside
    # semgrep/semgrep:latest-nonroot, whose user cannot write the runner's
    # file-command files under /__w/_temp: actions/checkout died on its first
    # saveState, upload-sarif on set_env, and the scan itself never ran. JS
    # actions in a container job are also handed the HOST workspace path as
    # checkout_path, which is not a git repository inside the container. So
    # the actions run on the runner, and only the scanner runs in its image.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Semgrep scan
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep
          semgrep scan --config auto --error --quiet --sarif --output semgrep.sarif .
      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
